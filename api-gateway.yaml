server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: patient-route
          uri: lb://patient-service
          predicates:
            - Path=/api/v1/patients/**, /api/v1/patients
      server:
        webflux:
          routes:
            - id: patient-route
              uri: lb://patient-service
              predicates:
                - Path=/api/v1/patients/**, /api/v1/patients

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.example.medicalgateway: DEBUG
