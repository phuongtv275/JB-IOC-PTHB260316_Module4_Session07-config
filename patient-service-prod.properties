server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5432/patient_db
spring.datasource.username=${POSTGRES_USER:rikkei}
spring.datasource.password=${POSTGRES_PASSWORD:rikkei}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [cid:%X{correlationId:-N/A}] %logger{36} - %msg%n
logging.level.com.example.patientservice=DEBUG
